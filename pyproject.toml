[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vlsbn"
version = "0.1.0"
description = "VLS_BN: Bayesian Network-based protein-ligand scoring function"
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.81",
    "rdkit>=2023.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "networkx>=3.0",
    "python-igraph>=0.10",
    "requests>=2.28",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pyarrow>=12.0",   # parquet I/O
    "joblib>=1.3",     # model serialisation
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vlsbn*"]
