name: vlsbn
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - statsmodels
  - joblib
  - multiprocess
  - cython
  - pyarrow
  - pytest
  - pip
  - pip:
      - biopython
      - requests
      # rdkit omitted: conda-forge builds require GLIBC>=2.25 (unavailable on
      # older HPC nodes).  _add_hydrogens() falls back to reduce (AmberTools).
      # On a modern workstation you can add it manually: pip install rdkit
