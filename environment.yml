name: vlsbn
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - statsmodels
  - joblib
  - multiprocess
  - cython
  - pyarrow
  - pytest
  - conda-forge::rdkit        # pip rdkit segfaults on many HPC Linux nodes
  - conda-forge::openbabel    # adds H atoms to PDB before getcontacts HB detection
  - pip
  - pip:
      - biopython
      - requests
